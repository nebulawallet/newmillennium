<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Flag of the Islamic Emirate of Afghanistan (the Taliban): the Shahada in black on white. Drawn for New Millennium (text set in the system's Arabic font); not from flag-icons. -->
  <rect width="640" height="480" fill="#fff"/>
  <g fill="#000" font-family="'Traditional Arabic', 'Arabic Typesetting', 'Amiri', 'Noto Naskh Arabic', 'Times New Roman', serif" text-anchor="middle" direction="rtl">
    <text x="320" y="210" font-size="76">لَا إِلٰهَ إِلَّا ٱللّٰهُ</text>
    <text x="320" y="330" font-size="76">مُحَمَّدٌ رَسُولُ ٱللّٰهِ</text>
  </g>
</svg>
