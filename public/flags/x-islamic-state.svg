<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Flag of the Islamic State (historical, shown for the faction in play): the first part of the Shahada in white on black over a white seal reading "Allah, Rasul, Muhammad". Drawn for New Millennium with the system's Arabic font; not from flag-icons. -->
  <rect width="640" height="480" fill="#000"/>
  <g font-family="'Traditional Arabic', 'Arabic Typesetting', 'Amiri', 'Noto Naskh Arabic', 'Times New Roman', serif" text-anchor="middle" direction="rtl">
    <text x="320" y="140" font-size="92" fill="#fff">لا إله إلا الله</text>
    <circle cx="320" cy="320" r="118" fill="#fff"/>
    <text x="320" y="268" font-size="64" fill="#000">الله</text>
    <text x="320" y="336" font-size="64" fill="#000">رسول</text>
    <text x="320" y="404" font-size="64" fill="#000">محمد</text>
  </g>
</svg>
